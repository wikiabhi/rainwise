# Config for the docker-compose deployment. Secrets come from the container's
# environment (see docker-compose.yml). See examples/config.yaml for every
# option and its explanation.

server:
  addr: ":8080"
  api_token: ${RAINWISE_API_TOKEN}

state:
  sqlite_path: /data/rainwise.db
  durable_wait: 0s

# Off until you have run, reviewed and applied a backfill. See the README.
automation:
  enabled: false

scheduler:
  enabled: false
  sync_every: 30m

processing:
  provider: raindrop
  taxonomy: default

providers:
  raindrop:
    type: raindrop
    token: ${RAINDROP_TOKEN}
    webhook_secret: ${RAINDROP_WEBHOOK_SECRET}
    incremental_since: false
    tag_listing: false

classifiers:
  openrouter:
    type: llm
    base_url: https://openrouter.ai/api/v1
    model: ${RAINWISE_MODEL}
    api_key: ${OPENROUTER_API_KEY}
    extra_body: {provider: {require_parameters: true}}

roles:
  classifier: openrouter
  proposer: openrouter
  fallback: null

taxonomies:
  default:
    mode: fixed
    collections:
      - {key: reference, name: Reference, description: "Documentation, guides and material to look up later."}
      - {key: projects, name: Projects, description: "Material for things you are building or working on."}
      - {key: reading, name: Reading, description: "Articles and long reads to read."}
      - key: needs_review
        name: Needs Review
        description: Reserved for low-confidence items.
        role: review
    rules: {min_tags: 2, max_tags: 5, min_confidence: 0.6, allow_new_tags: true}
    provision_missing_collections: true
