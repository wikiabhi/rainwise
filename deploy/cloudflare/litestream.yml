# Replicates the SQLite database to an R2 bucket over its S3 API.
# Variables are expanded by Litestream from the container environment.
dbs:
  - path: /data/rainwise.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: rainwise
        endpoint: ${LITESTREAM_ENDPOINT}
        region: auto
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        sync-interval: 5s
